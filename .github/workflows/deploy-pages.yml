name: Deploy Voltora Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  api-not-configured:
    if: ${{ vars.API_BASE_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment requirement
        run: echo "::notice::Set the repository variable API_BASE_URL to a public HTTPS API URL before deploying Voltora."

  build:
    if: ${{ vars.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        shell: bash
        run: |
          if [[ -z "$API_BASE_URL" ]]; then
            echo "Set the repository variable API_BASE_URL to the public HTTPS API URL before deploying."
            exit 1
          fi
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "API_BASE_URL must use HTTPS."
            exit 1
          fi
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: ${{ vars.API_BASE_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4